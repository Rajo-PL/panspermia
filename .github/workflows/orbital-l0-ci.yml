name: L0-ISM Lagrange Orbital Telemetry SMT Z3 CI

on:
  push:
    branches: [ "main" ]
    paths:
      - "scripts/**"
      - ".github/workflows/**"
  pull_request:
    branches: [ "main" ]

jobs:
  verify-orbital-l0:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install z3-solver ortools numpy

    - name: Compile C99 Orbital RTOS State Governor
      run: |
        gcc -std=c99 -Wall -Wextra -Werror -I scripts -O3 scripts/l0_orbit_governor_test.c -o scripts/l0_governor_test

    - name: Run C99 RTOS Hardware Verification Driver
      run: |
        ./scripts/l0_governor_test

    - name: Execute SMT Z3 Lagrange Orbital Telemetry Audit
      run: |
        python scripts/test_z3_lagrange_orbital_audit.py
